name: CI

on:
  push:
    branches:
      - main
      - "solution/**"
  pull_request:

jobs:
  # ─── Job 1: Static checks (no cluster needed) ────────────────────────────────
  ci:
    name: Lint · Test · Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Go lint (gofmt + go vet)
        run: make lint

      - name: Go tests (race detector)
        run: make test

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.8.x'

      - name: Terraform fmt + validate
        run: make tf-validate

      - name: Helm lint
        run: make helm-lint

      - name: Docker build
        run: make build

  # ─── Job 2: Full E2E on ephemeral Kind cluster ───────────────────────────────
  e2e:
    name: E2E (Kind)
    runs-on: ubuntu-latest
    needs: ci                        # only runs if ci passes
    env:
      # Set DB_PASSWORD in repo Settings → Secrets → Actions
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.8.x'

      # Install Kind binary only — cluster is created by 'make cluster'
      - uses: helm/kind-action@v1.10.0
        with:
          install_only: true

      # ── Cluster + image ──────────────────────────────────────────────────────
      - name: Create Kind cluster
        run: make cluster

      - name: Build & load app image
        run: make build load

      # Pre-load the Bitnami Postgres image into Kind so the pod never needs
      # to pull from Docker Hub (chart v16.3.0 pins a tag that was removed).
      - name: Pre-load Postgres image into Kind
        run: |
          docker pull --platform linux/amd64 bitnami/postgresql:latest
          docker save bitnami/postgresql:latest \
            | docker exec -i config-service-control-plane \
                ctr --namespace k8s.io images import --platform linux/amd64 -

      # ── Deploy ───────────────────────────────────────────────────────────────
      - name: Deploy (terraform apply)
        run: make deploy

      - name: Wait for rollout
        run: make wait

      # ── Validate ─────────────────────────────────────────────────────────────
      - name: Smoke tests
        run: make validate

      # ── Cleanup ──────────────────────────────────────────────────────────────
      - name: Teardown
        if: always()                 # clean up even if a step fails
        run: make down
