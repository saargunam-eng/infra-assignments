name: CI

on:
  push:
    branches:
      - main
      - "solution/**"
  pull_request:

defaults:
  run:
    working-directory: submission/saargunam-venkatesh

jobs:
  # ─── Job 1: Static checks (no cluster needed) ────────────────────────────────
  ci:
    name: Lint · Test · Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: submission/saargunam-venkatesh/go.sum

      - name: Go lint (gofmt + go vet)
        run: make lint

      - name: Go tests (race detector)
        run: make test

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.8.x'

      - name: Terraform fmt + validate
        run: make tf-validate

      - name: Helm lint
        run: make helm-lint

      - name: Docker build
        run: make build

  # ─── Job 2: Full E2E on ephemeral Kind cluster ───────────────────────────────
  e2e:
    name: E2E (Kind)
    runs-on: ubuntu-latest
    needs: ci
    env:
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: submission/saargunam-venkatesh/go.sum

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.8.x'

      - uses: helm/kind-action@v1.10.0
        with:
          install_only: true

      - name: Create Kind cluster
        run: make cluster

      - name: Build & load app image
        run: make build load

      - name: Pre-load Postgres image into Kind
        run: |
          docker pull --platform linux/amd64 bitnami/postgresql:latest
          docker save bitnami/postgresql:latest \
            | docker exec -i config-service-control-plane \
                ctr --namespace k8s.io images import --platform linux/amd64 -

      - name: Deploy (terraform apply)
        run: make deploy

      - name: Wait for rollout
        run: make wait

      - name: Smoke tests
        run: make validate

      - name: Teardown
        if: always()
        run: make down
